<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="مجموعه‌ای از سوالات مصاحبه PHP با جواب‌های کوتاه، کاربردی و فارسی؛ مناسب مرور سریع قبل از جلسه استخدام.">
    <title>سوالات مصاحبه PHP | پرسش و پاسخ استخدامی</title>
    <link rel="stylesheet" href="./src/output.css">
</head>

<body id="top" dir="rtl">
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute right-[-8rem] top-[-5rem] h-72 w-72 rounded-full bg-amber-300/35 blur-3xl"></div>
        <div class="absolute left-[-5rem] top-40 h-80 w-80 rounded-full bg-teal-300/25 blur-3xl"></div>
        <div class="absolute bottom-[-8rem] right-1/3 h-96 w-96 rounded-full bg-orange-200/35 blur-3xl"></div>
    </div>

    <main id="app" class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8 lg:py-12" aria-live="polite">
        <section class="loading-shell">
            <span class="section-kicker">در حال بارگذاری</span>
            <h1 class="status-title">در حال آماده‌سازی سوالات مصاحبه</h1>
        </section>
    </main>

    <noscript>
        <div class="mx-auto max-w-3xl px-4 pb-8">
            <section class="error-shell">
                <h2 class="status-title">برای نمایش این صفحه JavaScript لازم است</h2>
                <p class="status-text">
                    این نسخه داده‌ها را از فایل JSON می‌خواند، برای همین بدون JavaScript محتوای صفحه رندر نمی‌شود.
                </p>
            </section>
        </div>
    </noscript>

    <script type="module" src="./src/app.js"></script>
</body>

</html>
